openapi: 3.0.4

info:
  title: KUSHOP API
  description: KUSHOP Project from Kasetsart University Sriracha Campus.
  version: 0.1

servers:
  - url: http://localhost:3000/
    description: My Localhost

paths:
  /products:
    # GET All Product
    get:
      summary: Returns a list all of products.
      description: |
        List all products in array of object format.
        Each product contains details like product ID, name, price, etc.
      responses:
        '200':
          description: A JSON array of Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/products'

  /products/{id}:
    # GET Product by ID
    get:
      summary: Returns the specify products.
      description: |
        Show a product in object format.
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID
          schema:
            type: string
      responses:
        '200':
          description: A Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/products'

        '404':
          description: A product with the specified ID was not found.

        '500':
          description: Server error.

    # POST new product
    
    post:
      summary: Creates a new Product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new_product'

      responses:
        '201':
          description: Product is created.

        '409':
          description: Product ID already exists.

        '500':
          description: Server Error.
components:
  schemas:

    products:
      type: object
      properties:
        pdId:
          type: string

        pdName:
          type: string

        pdPrice:
          type: number

        pdRemark:
          type: string

        pdTypeId:
          type: string

        brandId:
          type: string

        brand:
          $ref: '#/components/schemas/brands'

        pdt:
          $ref: '#/components/schemas/productType'

    # Schema สำหรับ POST
    new_product:
      type: object
      properties:
        pdId:
          type: string

        pdName:
          type: string

        pdPrice:
          type: number

        pdRemark:
          type: string

        pdTypeId:
          type: string

        brandId:
          type: string

    brands:
      type: object
      properties:
        brandId:
          type: string

        brandName:
          type: string

    productType:
      type: object
      properties:
        pdTypeId:
          type: string

        pdTypeName:
          type: string